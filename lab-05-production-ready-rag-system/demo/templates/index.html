<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab-05 RAG Studio</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <div class="eyebrow">Lab-05</div>
          <h1>Production RAG Studio</h1>
          <p>Ingest documents, inspect retrieval, and generate grounded answers.</p>
        </div>
        <div class="hero-card">
          <div class="hero-title">RAG Control Panel</div>
          <div class="hero-subtitle">Built for real-world pipelines on AWS.</div>
        </div>
      </header>

      <section class="config">
        <div class="field">
          <label for="ingestUrl">Ingest API URL</label>
          <input id="ingestUrl" type="text" placeholder="https://.../prod/ingest" />
        </div>
        <div class="field">
          <label for="retrieveUrl">Retrieve API URL</label>
          <input id="retrieveUrl" type="text" placeholder="https://.../prod/retrieve" />
        </div>
        <div class="field">
          <label for="askUrl">Ask API URL</label>
          <input id="askUrl" type="text" placeholder="https://.../prod/ask" />
        </div>
        <div class="field">
          <label for="authToken">Auth Token</label>
          <input id="authToken" type="password" placeholder="Bearer token" />
        </div>
        <button id="saveConfig" class="btn primary">Save Settings</button>
      </section>

      <main class="grid">
        <section class="panel">
          <div class="panel-header">
            <h2>Ingest Document</h2>
            <div class="status" id="ingestStatus">Idle</div>
          </div>
          <div class="field">
            <label for="docId">Document ID</label>
            <input id="docId" type="text" placeholder="sample-doc" />
          </div>
          <div class="row">
            <div class="field">
              <label for="chunkSize">Chunk Size</label>
              <input id="chunkSize" type="number" min="200" max="2000" value="800" />
            </div>
            <div class="field">
              <label for="chunkOverlap">Chunk Overlap</label>
              <input id="chunkOverlap" type="number" min="0" max="400" value="120" />
            </div>
          </div>
          <div class="field">
            <label for="metadata">Metadata (JSON)</label>
            <textarea id="metadata" rows="3" placeholder='{"source":"manual","category":"lab"}'></textarea>
          </div>
          <div class="field">
            <label for="textInput">Text to Ingest</label>
            <textarea id="textInput" rows="8" placeholder="Paste content here..."></textarea>
          </div>
          <div class="field">
            <label for="fileInput">Or Upload .txt</label>
            <input id="fileInput" type="file" accept=".txt" />
          </div>
          <button id="ingestBtn" class="btn primary">Ingest</button>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Retrieve Context</h2>
            <div class="status" id="retrieveStatus">Idle</div>
          </div>
          <div class="field">
            <label for="queryInput">Query</label>
            <input id="queryInput" type="text" placeholder="What is RAG?" />
          </div>
          <div class="row">
            <div class="field">
              <label for="topK">Top K</label>
              <input id="topK" type="number" min="1" max="10" value="5" />
            </div>
            <div class="field">
              <label for="filters">Filters (JSON)</label>
              <input id="filters" type="text" placeholder='{"category":"lab"}' />
            </div>
          </div>
          <button id="retrieveBtn" class="btn primary">Retrieve</button>
          <div class="results" id="retrieveResults"></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Ask (RAG)</h2>
            <div class="status" id="askStatus">Idle</div>
          </div>
          <div class="field">
            <label for="questionInput">Question</label>
            <input id="questionInput" type="text" placeholder="Explain the RAG pipeline" />
          </div>
          <div class="row">
            <div class="field">
              <label for="askTopK">Top K</label>
              <input id="askTopK" type="number" min="1" max="10" value="5" />
            </div>
            <div class="field">
              <label for="temperature">Temperature</label>
              <input id="temperature" type="number" min="0" max="1" step="0.1" value="0.2" />
            </div>
          </div>
          <div class="field">
            <label for="modelId">Model ID (optional)</label>
            <input id="modelId" type="text" placeholder="anthropic.claude-3-sonnet-20240229-v1:0" />
          </div>
          <button id="askBtn" class="btn primary">Ask</button>
          <div class="answer" id="answerBox">
            <div class="answer-title">Answer</div>
            <div class="answer-text" id="answerText">No answer yet.</div>
            <div class="answer-title">Citations</div>
            <div class="results" id="citationResults"></div>
          </div>
        </section>
      </main>
    </div>

    <script>
      window.DEMO_DEFAULTS = {
        ingestUrl: "{{ default_ingest_url }}",
        retrieveUrl: "{{ default_retrieve_url }}",
        askUrl: "{{ default_ask_url }}",
        authToken: "{{ default_auth_token }}",
      };
    </script>
    <script src="/static/app.js"></script>
  </body>
</html>
